<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Inteligência Artificial no Direito</title>
    <link rel="icon" type="image/svg+xml" href="logo-gemini-notebook.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@500&family=Source+Sans+3:wght@400;500;600;700&display=swap">
    <style>
        /* Mapa mental radial em tinta preta: hub central, ramos à esquerda e à direita, folhas em texto puro. No celular vira uma árvore vertical. */
        :root {
            color-scheme: light;
            --bg: #F7F7F5;
            --surface: #FFFFFF;
            --ink: #111111;
            --muted: #6B7280;
            --line: #E2E2DE;
            --f-display: 'Lora', 'Georgia', 'Times New Roman', serif;
            --f-body: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
            --f-mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #0A0A0A;
                --surface: #121212;
                --ink: #F2F2F0;
                --muted: #9CA3AF;
                --line: #2A2A28;
                color-scheme: dark;
            }
        }

        :root[data-theme="dark"] {
            --bg: #0A0A0A;
            --surface: #121212;
            --ink: #F2F2F0;
            --muted: #9CA3AF;
            --line: #2A2A28;
            color-scheme: dark;
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            overflow-x: hidden
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: var(--f-body);
            font-size: 16px;
            line-height: 1.5;
            padding-block: 24px 48px;
            padding-left: max(16px, env(safe-area-inset-left, 0px));
            padding-right: max(16px, env(safe-area-inset-right, 0px));
        }

        .wrap {
            max-width: 1400px;
            margin: 0 auto
        }

        header.top {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px 32px;
            margin-bottom: 28px
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px
        }

        .profile .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            flex: 0 0 auto;
            border: 1px solid var(--line)
        }

        .profiletext {
            display: flex;
            flex-direction: column;
            line-height: 1.3
        }

        .profiletext strong {
            font: 700 18px var(--f-body);
            color: var(--ink)
        }

        .profiletext span {
            font-size: 15px;
            color: var(--muted)
        }

        header.top h1 {
            font-family: var(--f-display);
            font-weight: 700;
            font-size: clamp(1.5rem, 3.2vw, 2.1rem);
            line-height: 1.1;
            margin: 0 0 6px;
            text-wrap: balance
        }

        header.top p {
            margin: 0;
            max-width: 56ch;
            color: var(--muted);
        }

        .fixedtools {
            position: fixed;
            top: max(16px, env(safe-area-inset-top, 0px));
            right: max(16px, env(safe-area-inset-right, 0px));
            z-index: 390;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .reset {
            font: 600 13px var(--f-body);
            color: var(--ink);
            background: var(--surface);
            border: 1.5px solid var(--ink);
            border-radius: 999px;
            padding: 8px 16px;
            cursor: pointer
        }

        .reset:hover {
            background: var(--ink);
            color: var(--bg)
        }

        .themetoggle {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid var(--ink);
            background: var(--surface);
            color: var(--ink);
            border-radius: 999px;
            cursor: pointer
        }

        .themetoggle:hover {
            background: var(--ink);
            color: var(--bg)
        }

        .themetoggle svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        button {
            font-family: inherit
        }

        :focus-visible {
            outline: 2px solid var(--ink);
            outline-offset: 2px
        }

        /* nós: texto puro, sem caixa, com área de toque confortável */
        .node {
            display: block;
            background: none;
            border: none;
            padding: 3px 2px;
            margin: 0;
            color: var(--ink);
            cursor: pointer;
            text-wrap: balance;
        }

        .node.axis {
            font: 700 17px/1.3 var(--f-display);
        }

        .node.axis:hover {
            opacity: .55
        }

        .node.kid {
            font: 500 16px/1.3 var(--f-display);
        }

        .node.kid:hover {
            opacity: .55
        }

        /* mapa amplo (desktop): hub ao centro, ramos à esquerda e à direita */
        .map-viewport {
            position: relative;
            max-width: 100%;
            overflow-x: auto;
            overflow-y: visible;
            padding-block: 8px;
        }

        .map {
            position: relative
        }

        .map.wide {
            display: grid;
            grid-template-columns: 300px 290px 240px 180px 240px 290px 300px;
            column-gap: 56px;
            align-items: center;
            width: max-content;
            margin: 0 auto;
        }

        .map>svg {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: visible
        }

        .map>svg path {
            fill: none;
            stroke: var(--ink);
            stroke-width: 2.6;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 1
        }

        .map>svg path.plus {
            stroke: var(--surface);
            stroke-width: 1.8;
        }

        .col {
            position: relative;
            z-index: 1
        }

        .col ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 38px
        }

        .col-hub {
            align-self: center;
            display: flex;
            justify-content: center
        }

        .col-axesL ul,
        .col-kidsL ul {
            align-items: flex-end
        }

        .col-axesL .node,
        .col-kidsL .node {
            text-align: right
        }

        .col-axesR .node,
        .col-kidsR .node {
            text-align: left
        }

        .hub {
            display: inline-block;
            border: 2.5px solid var(--ink);
            border-radius: 14px;
            background: var(--surface);
            color: var(--ink);
            padding: 16px 20px;
            font: 700 16px/1.3 var(--f-display);
            text-align: center;
            max-width: 180px;
        }

        /* detalhe (cartão com conteúdo e prompts) */
        .detail {
            background: var(--surface);
            border: 1.5px solid var(--ink);
            border-radius: 14px;
            padding: 20px 22px;
            position: relative;
            z-index: 1
        }

        .detailhead {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px
        }

        .detail .eyebrow {
            margin: 0 0 4px;
            font: 500 12px var(--f-mono);
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--muted)
        }

        .maxbtn {
            flex: 0 0 auto;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid var(--ink);
            background: var(--surface);
            border-radius: 8px;
            color: var(--ink);
            cursor: pointer
        }

        .maxbtn:hover {
            background: var(--ink);
            color: var(--bg)
        }

        .maxbtn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .detail h3 {
            margin: 0 0 14px;
            font: 700 21px/1.2 var(--f-display);
            text-wrap: balance
        }

        .detail h4 {
            margin: 0 0 4px;
            font: 600 12px var(--f-body);
            letter-spacing: .07em;
            text-transform: uppercase;
            color: var(--muted)
        }

        .detail section {
            margin: 0 0 16px
        }

        .detail section:last-child {
            margin-bottom: 0
        }

        .detail p {
            margin: 0
        }

        .detail ul {
            margin: 4px 0 0;
            padding-left: 20px
        }

        .detail li {
            margin: 3px 0
        }

        .detail blockquote {
            margin: 6px 0 10px;
            padding: 12px 14px;
            border-radius: 10px;
            background: var(--bg);
            border: 1px solid var(--line);
            font-size: 16.5px
        }

        .copy {
            font: 600 13px var(--f-body);
            color: var(--ink);
            background: transparent;
            border: 1.5px solid var(--ink);
            border-radius: 999px;
            padding: 6px 13px;
            cursor: pointer
        }

        .copy:hover {
            background: var(--ink);
            color: var(--bg)
        }

        .linkbtn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font: 600 14px var(--f-body);
            color: var(--bg);
            background: var(--ink);
            border: 1.5px solid var(--ink);
            border-radius: 999px;
            padding: 9px 16px;
            text-decoration: none;
            cursor: pointer
        }

        .linkbtn:hover {
            opacity: .75
        }

        .attn {
            margin: 0;
            padding: 10px 12px;
            border-radius: 10px;
            background: var(--bg);
            border: 1px solid var(--ink);
            font-size: 14.5px
        }

        .promptbox {
            padding: 14px 14px 12px;
            border-radius: 10px;
            border: 1.5px dashed var(--ink);
            background: var(--bg)
        }

        .promptbox h4 {
            color: var(--ink)
        }

        .promptarea {
            width: 100%;
            min-height: 110px;
            margin-top: 6px;
            resize: vertical;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            color: var(--ink);
            font: 400 14.5px/1.45 var(--f-mono);
            padding: 10px 12px
        }

        .promptbox .copy {
            margin-top: 8px
        }

        .tablewrap {
            overflow-x: auto;
            margin-top: 4px
        }

        .detail table {
            border-collapse: collapse;
            width: 100%;
            font-size: 14.5px
        }

        .detail th {
            font: 600 12px var(--f-body);
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--muted);
            text-align: left;
            padding: 6px 10px 6px 0;
            border-bottom: 1px solid var(--line)
        }

        .detail td {
            padding: 8px 10px 8px 0;
            border-bottom: 1px solid var(--line);
            vertical-align: top
        }

        .detail tr:last-child td {
            border-bottom: 0
        }

        .detail td:first-child {
            font-weight: 600;
            white-space: nowrap
        }

        .detail td.num {
            font-variant-numeric: tabular-nums
        }

        /* árvore estreita (celular) */
        .map.narrow .hub {
            margin-bottom: 18px;
            display: block;
            max-width: none
        }

        .map.narrow ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 20px
        }

        .map.narrow .node.axis,
        .map.narrow .node.kid {
            text-align: left
        }

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 17px;
            height: 17px;
            border-radius: 50%;
            background: var(--ink);
            color: var(--surface);
            font: 700 12px/1 var(--f-body);
            margin-right: 9px;
            vertical-align: middle;
            flex: 0 0 auto;
        }

        .map.narrow .kids {
            margin: 10px 0 4px 2px;
            padding-left: 16px;
            border-left: 1.5px solid var(--ink)
        }

        .map.narrow .detail {
            margin: 2px 0 6px;
            padding: 16px 16px
        }

        .toast {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            background: var(--ink);
            color: var(--bg);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 600
        }

        .backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .5);
            z-index: 400
        }

        .detail.is-full {
            position: fixed;
            inset: clamp(8px, 3vw, 48px);
            z-index: 410;
            overflow: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .4);
            max-width: none;
            font-size: 1.2em
        }

        .detail.is-full .eyebrow {
            font-size: 14px
        }

        .detail.is-full h3 {
            font-size: 28px
        }

        .detail.is-full h4 {
            font-size: 14px
        }

        .detail.is-full p,
        .detail.is-full li {
            font-size: 18px;
            line-height: 1.55
        }

        .detail.is-full blockquote {
            font-size: 20px
        }

        .detail.is-full table {
            font-size: 17px
        }

        .detail.is-full th {
            font-size: 13.5px
        }

        .detail.is-full .promptarea {
            font-size: 16.5px
        }

        .detail.is-full .copy {
            font-size: 14.5px
        }

        .detail.is-full .linkbtn {
            font-size: 16px
        }

        .detail.is-full .attn {
            font-size: 16.5px
        }

        @media (prefers-reduced-motion:no-preference) {

            .detail,
            .col-kids li,
            .map.narrow .kids {
                animation: in .18s ease-out
            }

            @keyframes in {
                from {
                    opacity: 0;
                    transform: translateY(4px)
                }

                to {
                    opacity: 1;
                    transform: none
                }
            }
        }
    </style>
</head>

<body>
    <div class="fixedtools">
        <button class="reset" id="reset" type="button">Recolher tudo</button>
        <button class="themetoggle" id="themeToggle" type="button" aria-label="Alternar tema claro/escuro"></button>
    </div>
    <div class="wrap">
        <header class="top">
            <div>
                <div class="profile">
                    <img class="avatar" src="https://avatars.githubusercontent.com/u/4398869?v=4"
                        alt="Foto de Prof. Ermeson Silva" width="96" height="96" loading="lazy">
                    <div class="profiletext">
                        <strong>Prof. Ermeson Silva</strong>
                        <span>Coordenador Geral de Pós-graduação</span>
                        <span>Head de Inovação</span>
                    </div>
                </div>
                <h1>Inteligência Artificial no Direito</h1>
                <p>Otimizações, skills, agentes e artefatos. Clique em um ramo para abrir os itens; nos detalhes,
                    consulte o conteúdo e os prompts sugeridos, editáveis para registrar o uso na aula.</p>
            </div>
        </header>

        <div class="map-viewport" id="mapViewport">
            <main id="map" class="map"></main>
        </div>
    </div>

    <script>
        const AXES = [
            {
                t: 'Não vamos falar sobre', side: 'L', kids: [
                    {
                        t: 'Fora do escopo desta aula',
                        list: ['Engenharia de Prompts', 'Alucinação de IA', 'O que pode, o que não pode.']
                    }
                ]
            },
            {
                t: 'Vamos falar sobre', side: 'L', kids: [
                    {
                        t: 'Temas desta aula',
                        list: ['Otimizações', 'Skills', 'Agentes', 'Artefatos']
                    }
                ]
            },
            {
                t: 'Taxonomias', side: 'R', kids: [
                    { t: 'Agentes de IA', sections: [{ h: 'O que são', body: '[descreva]' }] },
                    { t: 'Skills', sections: [{ h: 'O que são', body: '[descreva]' }] },
                    { t: 'Artefatos', sections: [{ h: 'O que são', body: '[descreva]' }] }
                ]
            },
            {
                t: 'Prática', side: 'R', kids: [
                    {
                        t: '1 - RAG',
                        sections: [
                            { h: 'Preparação do corpus de conteúdo do modelo', body: 'Benefícios de preparar o corpus' },
                            { h: 'Formato Markdown', body: 'O que é' },
                            { h: 'Converter PDF em MD', body: 'Link para baixar o arquvi em pdf' },
                            { h: 'Ferramenta', body: 'Gemini' },
                            { h: 'Prompt', prompt: 'Construído na hora!' }
                        ]
                    },
                    {
                        t: '2 - Skill para criar um contrato interativo',
                        sections: [
                            { h: 'Preparação do conteúdo', body: 'Baixe o conteúdo do contrato em .md' },
                            { h: 'Ferramenta', body: 'Gemini' },
                            { h: 'Prompt', prompt: '{prompt}' }
                        ]
                    },
                    {
                        t: '3 - Caso Penal Interativo',
                        sections: [
                            { h: 'Preparação do conteúdo', body: 'Baixe o conteúdo do contrato em .md' },
                            { h: 'Ferramenta', body: 'Gemini e Google Sites' },
                            { h: 'Prompt', prompt: '{prompt}' }
                        ]
                    },
                    {
                        t: '4 - Engenheiro de Prompts Jurídicos',
                        sections: [
                            { h: 'O que é', body: '[descreva]' },
                            { h: 'Ferramenta', body: 'Claude ou Gemini' },
                            { h: 'Prompt', prompt: 'Construído na hora!' }
                        ]
                    },
                    {
                        t: '5 - Skill de Petição Inicial Interativa Explicada',
                        sections: [
                            { h: 'O que é', body: '[descreva]' },
                            { h: 'Ferramenta', body: 'Claude ou Gemini' },
                            { h: 'Prompt', prompt: '{prompt}' }
                        ]
                    },
                    {
                        t: '6 - Cofre de Prompts',
                        sections: [
                            { h: 'O que é', body: '[descreva]' },
                            { h: 'Ferramenta', body: 'Gemini e Google Sheets' },
                            { h: 'Prompt', prompt: 'Construído na hora!' }
                        ]
                    }
                ]
            }
        ];

        const HUB_TITLE = 'Inteligência Artificial no Direito';

        const map = document.getElementById('map');
        const mq = window.matchMedia('(min-width: 1040px)');
        let st = { a: null, c: null };
        let fullEl = null;
        let fullPlaceholder = null;

        function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

        const ICON_MAX = '<svg viewBox="0 0 24 24"><path d="M9 3H4v5M15 3h5v5M9 21H4v-5M15 21h5v-5"/></svg>';
        const ICON_MIN = '<svg viewBox="0 0 24 24"><path d="M4 9h5V4M20 9h-5V4M4 15h5v5M20 15h-5v5"/></svg>';
        const ICON_SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v3M12 18.5v3M3.5 12h3M17.5 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>';
        const ICON_MOON = '<svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>';

        const themeToggle = document.getElementById('themeToggle');

        function effectiveTheme() {
            const attr = document.documentElement.getAttribute('data-theme');
            if (attr) return attr;
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function paintThemeIcon() {
            const t = effectiveTheme();
            themeToggle.innerHTML = t === 'dark' ? ICON_SUN : ICON_MOON;
            themeToggle.setAttribute('aria-label', t === 'dark' ? 'Mudar para modo claro' : 'Mudar para modo escuro');
        }

        function initTheme() {
            try {
                const saved = localStorage.getItem('ac-theme');
                if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
            } catch (err) { /* privado ou bloqueado: segue com o tema do sistema */ }
            paintThemeIcon();
        }

        themeToggle.addEventListener('click', () => {
            const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('ac-theme', next); } catch (err) { /* ignora */ }
            paintThemeIcon();
        });

        initTheme();

        function detailHTML(a, c, ai, ci) {
            const pid = `a${ai}-c${ci}`;
            let h = `<article class="detail" id="detail-${pid}">`;
            h += `<div class="detailhead"><p class="eyebrow">${esc(a.t)}</p><button type="button" class="maxbtn" data-maximize aria-label="Maximizar caixa" aria-pressed="false">${ICON_MAX}</button></div>`;
            h += `<h3>${esc(c.t)}</h3>`;
            if (c.k) h += `<section><h4>Ideia central</h4><p>${esc(c.k)}</p></section>`;
            if (c.list) h += `<section><ul>${c.list.map(x => `<li>${esc(x)}</li>`).join('')}</ul></section>`;
            if (c.items) {
                const itemsHTML = items => `<ul>${items.map(item => `<li>${esc(item.t)}${item.children ? itemsHTML(item.children) : ''}</li>`).join('')}</ul>`;
                h += `<section>${itemsHTML(c.items)}</section>`;
            }
            if (c.rows) {
                const head = c.head ? `<thead><tr>${c.head.map(x => `<th>${esc(x)}</th>`).join('')}</tr></thead>` : '';
                h += `<section><div class="tablewrap"><table>${head}<tbody>${c.rows.map(r => `<tr>${r.map((x, i) => `<td${i > 0 && /\d/.test(x) && r.length === 2 ? ' class="num"' : ''}>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`;
            }
            if (c.link) h += `<section><a class="linkbtn" href="${esc(c.link.url)}" target="_blank" rel="noopener noreferrer">${esc(c.link.label)} ↗</a></section>`;
            if (c.prompt) h += `<section class="promptbox"><h4>Prompt sugerido — editável</h4><textarea class="promptarea" data-prompt-id="${pid}" placeholder="Cole ou escreva aqui o prompt usado nesta etapa...">${typeof c.prompt === 'string' ? esc(c.prompt) : ''}</textarea><button class="copy" type="button" data-copy-prompt="${pid}">Copiar prompt</button></section>`;
            if (c.attn) h += `<section><p class="attn"><strong>Atenção.</strong> ${esc(c.attn)}</p></section>`;
            if (c.sections) {
                c.sections.forEach((s, si) => {
                    if (s.prompt !== undefined) {
                        const spid = `${pid}-s${si}`;
                        h += `<section class="promptbox"><h4>${esc(s.h)}</h4><textarea class="promptarea" data-prompt-id="${spid}" placeholder="Cole ou escreva aqui o prompt usado nesta etapa...">${esc(s.prompt)}</textarea><button class="copy" type="button" data-copy-prompt="${spid}">Copiar prompt</button></section>`;
                    } else {
                        h += `<section><h4>${esc(s.h)}</h4><p>${esc(s.body)}</p></section>`;
                    }
                });
            }
            return h + '</article>';
        }

        const hubHTML = `<div class="hub">${esc(HUB_TITLE)}</div>`;

        function axisBtn(a, i) {
            return `<li><button type="button" class="node axis" data-a="${i}" aria-expanded="${st.a === i}">${esc(a.t)}</button></li>`;
        }

        function renderWide() {
            map.className = 'map wide';
            const leftAxes = AXES.map((a, i) => ({ a, i })).filter(o => o.a.side === 'L');
            const rightAxes = AXES.map((a, i) => ({ a, i })).filter(o => o.a.side === 'R');
            const activeSide = st.a !== null ? AXES[st.a].side : null;

            const kidsHTML = side => {
                if (activeSide !== side) return '';
                const a = AXES[st.a];
                return `<ul>${a.kids.map((c, j) => `<li><button type="button" class="node kid" data-c="${j}" aria-expanded="${st.c === j}">${esc(c.t)}</button></li>`).join('')}</ul>`;
            };
            const detailFor = side => {
                if (activeSide !== side || st.c === null) return '';
                return detailHTML(AXES[st.a], AXES[st.a].kids[st.c], st.a, st.c);
            };

            let h = '<svg aria-hidden="true"></svg>';
            h += `<div class="col col-detail col-detailL">${detailFor('L')}</div>`;
            h += `<div class="col col-kids col-kidsL">${kidsHTML('L')}</div>`;
            h += `<div class="col col-axes col-axesL"><ul>${leftAxes.map(o => axisBtn(o.a, o.i)).join('')}</ul></div>`;
            h += `<div class="col col-hub">${hubHTML}</div>`;
            h += `<div class="col col-axes col-axesR"><ul>${rightAxes.map(o => axisBtn(o.a, o.i)).join('')}</ul></div>`;
            h += `<div class="col col-kids col-kidsR">${kidsHTML('R')}</div>`;
            h += `<div class="col col-detail col-detailR">${detailFor('R')}</div>`;

            map.innerHTML = h;
            restorePrompts();
            requestAnimationFrame(draw);
        }

        function badge(open) { return `<span class="badge">${open ? '−' : '+'}</span>`; }

        function renderNarrow() {
            map.className = 'map narrow';
            let h = hubHTML + '<ul>';
            AXES.forEach((a, i) => {
                const open = st.a === i;
                h += `<li><button type="button" class="node axis" data-a="${i}" aria-expanded="${open}">${badge(open)}${esc(a.t)}</button>`;
                if (open) {
                    h += '<ul class="kids">';
                    a.kids.forEach((c, j) => {
                        const o2 = st.c === j;
                        h += `<li><button type="button" class="node kid" data-c="${j}" aria-expanded="${o2}">${badge(o2)}${esc(c.t)}</button>${o2 ? detailHTML(a, c, i, j) : ''}</li>`;
                    });
                    h += '</ul>';
                }
                h += '</li>';
            });
            map.innerHTML = h + '</ul>';
            restorePrompts();
        }

        const STUB = 40, CIRCLE_R = 8, RULE_GAP = 6;

        function draw() {
            const svg = map.querySelector('svg'); if (!svg) return;
            const m = map.getBoundingClientRect();
            svg.setAttribute('width', m.width); svg.setAttribute('height', m.height);
            const R = el => {
                const r = el.getBoundingClientRect();
                return { l: r.left - m.left, r: r.right - m.left, t: r.top - m.top, b: r.bottom - m.top, cy: (r.top + r.bottom) / 2 - m.top };
            };
            const curve = (x1, y1, x2, y2) => { const mx = (x1 + x2) / 2; return `M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`; };
            const plusMark = (x, y) => `<circle cx="${x}" cy="${y}" r="${CIRCLE_R}" fill="var(--ink)"/><path class="plus" d="M${x - 4} ${y} H${x + 4} M${x} ${y - 4} V${y + 4}"/>`;

            let p = '';
            const hub = R(map.querySelector('.hub'));

            map.querySelectorAll('.axis').forEach(b => {
                const i = +b.dataset.a, side = AXES[i].side, r = R(b);
                const near = side === 'R' ? r.l : r.r, far = side === 'R' ? r.r : r.l;
                const ly = r.b + RULE_GAP;
                const hubX = side === 'R' ? hub.r : hub.l;
                p += `<path d="${curve(hubX, hub.cy, near, ly)} L${far} ${ly}"/>`;
                if (st.a !== i) {
                    const end = far + (side === 'R' ? STUB : -STUB);
                    p += `<path d="M${far} ${ly} L${end} ${ly}"/>`;
                    p += plusMark(end, ly);
                }
            });

            if (st.a !== null) {
                const a = AXES[st.a], side = a.side, ar = R(map.querySelector(`[data-a="${st.a}"]`));
                const aFar = side === 'R' ? ar.r : ar.l;
                const aLy = ar.b + RULE_GAP;
                map.querySelectorAll('.kid').forEach(b => {
                    const j = +b.dataset.c, r = R(b);
                    const near = side === 'R' ? r.l : r.r, far = side === 'R' ? r.r : r.l;
                    const ly = r.b + RULE_GAP;
                    p += `<path d="${curve(aFar, aLy, near, ly)} L${far} ${ly}"/>`;
                    if (st.c !== j) {
                        const end = far + (side === 'R' ? STUB : -STUB);
                        p += `<path d="M${far} ${ly} L${end} ${ly}"/>`;
                        p += plusMark(end, ly);
                    }
                });
                if (st.c !== null) {
                    const kr = R(map.querySelector(`[data-c="${st.c}"]`));
                    const kFar = side === 'R' ? kr.r : kr.l;
                    const kLy = kr.b + RULE_GAP;
                    const d = map.querySelector('.detail');
                    if (d) {
                        const dr = R(d);
                        const dTarget = side === 'R' ? dr.l : dr.r;
                        p += `<path d="${curve(kFar, kLy, dTarget, dr.t + 32)}"/>`;
                    }
                }
            }
            svg.innerHTML = p;
        }

        function render() { mq.matches ? renderWide() : renderNarrow(); }

        function promptKey(id) { return 'ac-prompt:' + id; }

        function restorePrompts() {
            map.querySelectorAll('.promptarea').forEach(ta => {
                try {
                    const saved = localStorage.getItem(promptKey(ta.dataset.promptId));
                    if (saved) ta.value = saved;
                } catch (err) { /* privado ou bloqueado: segue sem restaurar */ }
            });
        }

        map.addEventListener('input', e => {
            const ta = e.target.closest('.promptarea');
            if (!ta) return;
            try { localStorage.setItem(promptKey(ta.dataset.promptId), ta.value); } catch (err) { /* ignora */ }
        });

        function openFullscreen(el) {
            if (fullEl) closeFullscreen();
            const backdrop = document.createElement('div');
            backdrop.className = 'backdrop';
            backdrop.id = 'detail-backdrop';
            backdrop.addEventListener('click', closeFullscreen);
            fullPlaceholder = document.createComment('detail fullscreen placeholder');
            el.before(fullPlaceholder);
            document.body.appendChild(backdrop);
            document.body.appendChild(el);
            el.classList.add('is-full');
            const btn = el.querySelector('[data-maximize]');
            if (btn) {
                btn.innerHTML = ICON_MIN;
                btn.setAttribute('aria-pressed', 'true');
                btn.setAttribute('aria-label', 'Restaurar tamanho');
            }
            fullEl = el;
        }

        function closeFullscreen() {
            if (!fullEl) return;
            fullEl.classList.remove('is-full');
            const btn = fullEl.querySelector('[data-maximize]');
            if (btn) {
                btn.innerHTML = ICON_MAX;
                btn.setAttribute('aria-pressed', 'false');
                btn.setAttribute('aria-label', 'Maximizar caixa');
            }
            if (fullPlaceholder && fullPlaceholder.parentNode) {
                fullPlaceholder.parentNode.insertBefore(fullEl, fullPlaceholder);
                fullPlaceholder.remove();
            }
            fullPlaceholder = null;
            const backdrop = document.getElementById('detail-backdrop');
            if (backdrop) backdrop.remove();
            fullEl = null;
        }

        document.addEventListener('click', e => {
            const mx = e.target.closest('[data-maximize]');
            if (mx) {
                const d = mx.closest('.detail');
                if (d.classList.contains('is-full')) closeFullscreen(); else openFullscreen(d);
                return;
            }
            const cpp = e.target.closest('[data-copy-prompt]');
            if (cpp) { copyPrompt(cpp); return; }
            const cp = e.target.closest('[data-copy]');
            if (cp) { copyText(cp); return; }
            const b = e.target.closest('button[data-a], button[data-c]');
            if (!b) return;
            if (b.dataset.a !== undefined) {
                const i = +b.dataset.a;
                st = st.a === i ? { a: null, c: null } : { a: i, c: null };
            } else {
                const j = +b.dataset.c;
                st.c = st.c === j ? null : j;
            }
            closeFullscreen();
            render();
            const f = map.querySelector(b.dataset.a !== undefined ? `[data-a="${b.dataset.a}"]` : `[data-c="${b.dataset.c}"]`);
            if (f) f.focus({ preventScroll: true });
        });

        document.addEventListener('keydown', e => { if (e.key === 'Escape' && fullEl) closeFullscreen(); });

        document.getElementById('reset').addEventListener('click', () => { closeFullscreen(); st = { a: null, c: null }; render(); });

        function toast(msg) {
            const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
            document.body.appendChild(t); setTimeout(() => t.remove(), 1800);
        }
        function copyText(btn) {
            const q = btn.closest('section').querySelector('blockquote');
            const text = q.textContent;
            const fallback = () => {
                const r = document.createRange(); r.selectNodeContents(q);
                const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
                toast('Texto selecionado. Use Ctrl+C para copiar.');
            };
            try {
                navigator.clipboard.writeText(text).then(() => toast('Texto copiado'), fallback);
            } catch (err) { fallback(); }
        }
        function copyPrompt(btn) {
            const ta = btn.closest('section').querySelector('.promptarea');
            const text = ta.value;
            if (!text) { toast('Nada para copiar ainda'); return; }
            const fallback = () => { ta.focus(); ta.select(); toast('Texto selecionado. Use Ctrl+C para copiar.'); };
            try {
                navigator.clipboard.writeText(text).then(() => toast('Prompt copiado'), fallback);
            } catch (err) { fallback(); }
        }

        mq.addEventListener('change', () => { closeFullscreen(); render(); });
        window.addEventListener('resize', () => { if (mq.matches) requestAnimationFrame(draw); });
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (mq.matches) draw(); });
        render();
    </script>
</body>

</html>
